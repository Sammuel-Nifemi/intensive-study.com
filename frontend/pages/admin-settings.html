<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Settings | Intensive Study Academy</title>
  <link rel="stylesheet" href="../css/student-dashboard.css" />
</head>
<body>
<header class="dashboard-header">
  <div class="header-container">
    <div class="logo">
      <img src="../image/isa.png" alt="Intensive Study Academy Logo">
    </div>
    <div class="user-text"><strong>Admin</strong></div>
  </div>
</header>

<div class="dashboard-layout">
  <nav class="dashboard-sidebar">
    <ul class="sidebar-top">
      <li><a href="/frontend/pages/admin-dashboard.html">Dashboard</a></li>
      <li><a href="/frontend/pages/admin-students.html">Students</a></li>
      <li><a href="/frontend/pages/admin-staff.html">Staff</a></li>
      <li><a href="/frontend/pages/admin-requests.html">Requests</a></li>
      <li><a href="/frontend/pages/admin-complaints.html">Complaints</a></li>
      <li><a href="/frontend/pages/admin-analytics.html">Analytics</a></li>
      <li><a href="/frontend/pages/admin-settings.html" class="active">Settings</a></li>
    </ul>
    <div class="sidebar-bottom">
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>
  </nav>

  <main class="dashboard-main">
    <section class="page-header">
      <h1>Admin Settings</h1>
      <p>Theme preferences and configuration.</p>
    </section>

    <section class="dashboard-section">
      <div class="form-row">
        <label for="adminTheme">Theme</label>
        <select id="adminTheme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="purple">Purple</option>
        </select>
      </div>
      <button id="saveSettingsBtn" class="primary-btn" type="button">Save Settings</button>
    </section>
  </main>
</div>

<script src="../js/admin-guard.js"></script>
<script src="../js/admin-logout.js"></script>
<script src="../js/admin-settings.js"></script>
</body>
</html>
