<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | Intensive Study Academy</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <link rel="stylesheet" href="../css/auth.css" />

</head>

<body class="auth-page">

  <div class="auth-container">
    <h1>Student Login</h1>
    <p>Login to access your student dashboard</p>

    <form id="studentLoginForm">
      <div class="form-group">
        <label>Email</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email address"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />
      </div>
       
      <p class="auth-note">
     New student?
      <a href="/frontend/pages/student-registration.html">Create an account</a>
        </p>

      <button type="submit" class="primary-btn">
        Login
      </button>
    </form>

    <p class="auth-note">
      Having trouble logging in? Contact support.
      <a href="https://wa.me/2347073859837" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp"></i>
      </a>
    </p>
  </div>
<script src="/frontend/js/auth-debug.js"></script>
<script src="/frontend/js/student-login.js"></script>

</html>
